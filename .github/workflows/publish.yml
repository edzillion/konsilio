name: Publish to npm

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Delete existing tag if present
        run: |
          BUMP="${{ github.event.inputs.version || 'patch' }}"
          CURRENT=$(node -p "require('./package.json').version")
          NEW=$(node -p "
            const semver = require('semver');
            semver.inc('$CURRENT', '$BUMP');
          " 2>/dev/null || node -e "
            const [major, minor, patch] = '$CURRENT'.split('.').map(Number);
            if ('$BUMP' === 'major') console.log(\`\${major+1}.0.0\`);
            else if ('$BUMP' === 'minor') console.log(\`${major}.\${minor+1}.0\`);
            else console.log(\`${major}.\${minor}.\${patch+1}\`);
          ")
          echo "Deleting tag v$NEW (bumping $CURRENT by $BUMP)"
          git tag -d "v$NEW" 2>/dev/null || true
          git push --delete origin "v$NEW" 2>/dev/null || true

      - name: Bump version
        run: npm version ${{ github.event.inputs.version || 'patch' }}

      - name: Add [skip ci] to version commit
        run: |
          git commit --amend -m "$(git log -1 --format='%s') [skip ci]"

      - name: Push version bump
        run: |
          git push origin HEAD:release --tags

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
